name: build-and-test
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
      - name: Compile
        run: make
      - name: Unit tests
        run: make test
